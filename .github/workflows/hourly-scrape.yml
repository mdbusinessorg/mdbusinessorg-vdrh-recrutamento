name: Scrape e processa vagas (hora a hora)

on:
  schedule:
    - cron: '0 * * * *'   # todas as horas, todos os dias
  workflow_dispatch:

jobs:
  scrape-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar scrape-jobs
        run: |
          curl -s -X POST "https://noywnuafpxvxvmfkjtbh.supabase.co/functions/v1/scrape-jobs" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 300

      - name: Processar vagas pendentes
        run: |
          curl -s -X POST "https://noywnuafpxvxvmfkjtbh.supabase.co/functions/v1/retry-pending-jobs" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 300
